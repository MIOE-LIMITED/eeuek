name = "klimasun-urun-redirect"
main = "src/index.js"
compatibility_date = "2026-07-01"
workers_dev = false

# Sadece eski URL kalıplarının geçtiği yollar worker'a girer;
# sitenin geri kalanı (assets, ana sayfa vs.) worker'a hiç uğramaz.
routes = [
  { pattern = "klimasun.com/urun/*", zone_name = "klimasun.com" },
  { pattern = "www.klimasun.com/urun/*", zone_name = "klimasun.com" },
  { pattern = "klimasun.com/kategori/*", zone_name = "klimasun.com" },
  { pattern = "www.klimasun.com/kategori/*", zone_name = "klimasun.com" },
]
